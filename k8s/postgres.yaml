apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: sistema
spec:
  acessModes: [ "ReadWriteOnce" ]
  resources:
    requests:
      storage: 

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: sistema
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_PASSWORD
            - name: POSTGRESS_DB
              valueFrom:
                secretKeyRef:
                  name: app-secret 
                  key: DB_NAME
          ports:
            - containerPort: 5432
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: sistema
spec:
  ports:
    - port: 5432
      targetport: 5432
  selector:
    app: postgres