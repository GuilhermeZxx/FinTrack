apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sistema-Ingress
  annotations:
    kubernetes.io/Ingress.class: nginx
spec:
  rules:
    - host: sistema.seudominio.com
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
          service:
            name: frontend-service
            port:
              number: 80
        - path: /api
          pathType: Prefix
          backend:
            service:
              name: backend-service
              port:
                number: 8000
